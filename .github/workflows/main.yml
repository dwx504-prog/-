
name: Build Windows EXE V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Word公式图片转换助手_V2" word_formula_to_image.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Word公式图片转换助手-V2-Windows
          path: dist/Word公式图片转换助手_V2.exe
          if-no-files-found: error
